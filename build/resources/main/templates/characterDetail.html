<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${character.name})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <a class="btn btn-link px-0 mb-3" th:href="@{/characters}">
        <i class="bi bi-arrow-left"></i> <span th:text="#{detail.back}">Back to characters</span>
    </a>

    <div class="card shadow-sm mb-4">
        <div class="row g-0">
            <div class="col-md-4">
                <img class="img-fluid rounded-start character-img w-100"
                     th:src="${character.appearance}" th:alt="${character.name}">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h1 class="card-title h3 mb-3" th:text="${character.name}">Name</h1>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span th:text="#{characters.table.id}">ID</span>
                            <span th:text="${character.id}">0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span th:text="#{characters.table.age}">Age</span>
                            <span th:text="${character.age}">0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span th:text="#{characters.table.powertype}">Powertype</span>
                            <span class="badge text-bg-info align-self-center" th:text="${character.powertype}">TYPE</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span th:text="#{characters.table.power}">Power</span>
                            <span class="badge text-bg-primary align-self-center" th:text="${character.power} + ' DON'">0</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <section class="mb-4" th:if="${swordName != null}">
        <div class="card border-warning shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">
                    <i class="bi bi-shield"></i> <span th:text="#{characterDetail.swordsman}">Swordsman</span>
                </h2>
                <p class="mb-3">
                    <strong th:text="#{characterDetail.sword}">Sword:</strong>
                    <span class="badge text-bg-warning fs-6" th:text="${swordName}">sword</span>
                </p>
                <form th:action="@{/characters/{id}/sword(id=${character.id})}" method="post" class="row g-2">
                    <div class="col-sm-8">
                        <input type="text" name="swordName" class="form-control"
                               th:value="${swordName}" required>
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-warning w-100">
                            <i class="bi bi-pencil"></i> <span th:text="#{characterDetail.updateSword}">Update sword</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <section class="mb-4" th:if="${character.crew != null}">
        <h2 class="h4 mb-3" th:text="#{characterDetail.crew}">Crew</h2>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                <tr>
                    <th th:text="#{crews.table.name}">Name</th>
                    <th th:text="#{crews.table.ship}">Ship</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>
                        <a th:href="@{/crews/{name}(name=${character.crew.name})}"
                           th:text="${character.crew.name}">crew name</a>
                    </td>
                    <td th:text="${character.crew.shipName}">ship</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0" th:text="#{characterDetail.battles}">Battles</h2>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="reloadBattlesButton"
                    th:data-character-id="${character.id}">
                <i class="bi bi-arrow-clockwise"></i> Reload
            </button>
        </div>
        <div class="alert alert-secondary" id="battlesEmptyAlert"
             th:classappend="${#lists.isEmpty(battles)} ? '' : 'd-none'"
             th:text="#{characterDetail.battles.empty}">No battles yet.</div>
        <div class="table-responsive" id="battlesTable"
             th:classappend="${#lists.isEmpty(battles)} ? 'd-none' : ''">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th th:text="#{battles.table.name}">Name</th>
                    <th th:text="#{battles.table.location}">Location</th>
                    <th th:text="#{battles.table.date}">Date</th>
                    <th th:text="#{battles.table.winner}">Winner</th>
                </tr>
                </thead>
                <tbody id="battlesTableBody">
                <tr th:each="battle : ${battles}">
                    <td>
                        <a th:href="@{/battles/{id}(id=${battle.id})}" th:text="${battle.name}">name</a>
                    </td>
                    <td th:text="${battle.location}"></td>
                    <td th:text="${#temporals.format(battle.date, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${battle.winner}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/characterBattles.js}"></script>

</body>
</html>
