<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${battle.name})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <a class="btn btn-link px-0 mb-3" th:href="@{/battles}">
        <i class="bi bi-arrow-left"></i> <span th:text="#{battleDetail.back}">Back to battles</span>
    </a>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h1 class="card-title h3 mb-3" th:text="${battle.name}">Battle</h1>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between">
                    <span th:text="#{battles.table.location}">Location</span>
                    <span th:text="${battle.location}">loc</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span th:text="#{battles.table.date}">Date</span>
                    <span th:text="${#temporals.format(battle.date, 'yyyy-MM-dd HH:mm')}">date</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span th:text="#{battles.table.winner}">Winner</span>
                    <span class="badge text-bg-success align-self-center" th:text="${battle.winner}">w</span>
                </li>
            </ul>
        </div>
    </div>

    <section>
        <h2 class="h4 mb-3" th:text="#{battleDetail.characters}">Participants</h2>
        <div class="alert alert-secondary" th:if="${#lists.isEmpty(characters)}"
             th:text="#{battleDetail.characters.empty}">No characters yet.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(characters)}">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th th:text="#{characters.table.id}">ID</th>
                    <th th:text="#{characters.table.name}">Name</th>
                    <th th:text="#{characters.table.powertype}">Powertype</th>
                    <th th:text="#{characters.table.power}">Power</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="character : ${characters}">
                    <td th:text="${character.id}"></td>
                    <td>
                        <a th:href="@{/characters/{id}(id=${character.id})}" th:text="${character.name}">name</a>
                    </td>
                    <td>
                        <span class="badge text-bg-info" th:text="${character.powertype}">TYPE</span>
                    </td>
                    <td>
                        <span sec:authorize="isAuthenticated()"
                              class="badge text-bg-primary" th:text="${character.power} + ' DON'">0</span>
                        <span sec:authorize="isAnonymous()"
                              class="badge text-bg-secondary"
                              th:title="#{characters.power.hiddenHint}"
                              th:text="#{characters.power.hidden}">???</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
