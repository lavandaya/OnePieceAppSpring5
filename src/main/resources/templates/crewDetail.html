<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${crew.name})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <a class="btn btn-link px-0 mb-3" th:href="@{/crews}">
        <i class="bi bi-arrow-left"></i> <span th:text="#{crewDetail.back}">Back to crews</span>
    </a>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h1 class="card-title h3 mb-3" th:text="${crew.name}">Crew</h1>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between">
                    <span th:text="#{crews.table.ship}">Ship</span>
                    <span th:text="${crew.shipName}">ship</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span th:text="#{crews.table.bounty}">Bounty</span>
                    <span>
                        <i class="bi bi-check-circle-fill text-success" th:if="${crew.hasBounty}"></i>
                        <i class="bi bi-x-circle text-muted" th:unless="${crew.hasBounty}"></i>
                    </span>
                </li>
            </ul>
        </div>
    </div>

    <section>
        <h2 class="h4 mb-3" th:text="#{crewDetail.members}">Members</h2>
        <div class="alert alert-secondary" th:if="${#lists.isEmpty(members)}"
             th:text="#{crewDetail.members.empty}">No members.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(members)}">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th th:text="#{characters.table.id}">ID</th>
                    <th th:text="#{characters.table.name}">Name</th>
                    <th th:text="#{characters.table.age}">Age</th>
                    <th th:text="#{characters.table.powertype}">Powertype</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${members}">
                    <td th:text="${m.id}"></td>
                    <td>
                        <a th:href="@{/characters/{id}(id=${m.id})}" th:text="${m.name}">name</a>
                    </td>
                    <td th:text="${m.age}"></td>
                    <td>
                        <span class="badge text-bg-info" th:text="${m.powertype}">TYPE</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
