<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{battles.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{battles.heading}">Battles</h1>

    <form class="row g-2 align-items-end mb-4" th:action="@{/battles}" method="get">
        <div class="col-12 col-sm-auto">
            <label for="nameContains" class="form-label" th:text="#{battles.filter.name}">Name contains:</label>
            <input type="text" id="nameContains" name="nameContains" class="form-control" th:value="${nameContains}">
        </div>
        <div class="col-12 col-sm-auto">
            <label for="fromDate" class="form-label" th:text="#{battles.filter.fromDate}">From date:</label>
            <input type="date" id="fromDate" name="fromDate" class="form-control" th:value="${fromDate}">
        </div>
        <div class="col-12 col-sm-auto">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-funnel"></i> <span th:text="#{button.filter}">Filter</span>
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/battles}" th:text="#{button.reset}">Reset</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th th:text="#{battles.table.name}">Name</th>
                <th th:text="#{battles.table.location}">Location</th>
                <th th:text="#{battles.table.date}">Date</th>
                <th th:text="#{battles.table.winner}">Winner</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="battle : ${battles}"
                th:classappend="${battle.winner == 'Luffy'} ? 'table-warning' : ''">
                <td>
                    <a th:href="@{/battles/{id}(id=${battle.id})}" th:text="${battle.name}">name</a>
                </td>
                <td th:text="${battle.location}"></td>
                <td th:text="${#temporals.format(battle.date, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${battle.winner}"></td>
                <td class="text-end">
                    <form th:action="@{/battles/{id}/delete(id=${battle.id})}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                th:title="#{button.delete}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted fst-italic" th:text="#{battles.count(${#lists.size(battles)})}">Number of battles: 0</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
