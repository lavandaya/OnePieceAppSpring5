<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.general.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5">
    <div class="alert alert-warning shadow-sm" role="alert">
        <h1 class="alert-heading">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="#{error.general.heading}">Something went wrong</span>
        </h1>
        <p th:text="#{error.general.intro}">An unexpected error occurred.</p>
        <hr>
        <p class="mb-0 fst-italic" th:text="${errorMessage}">Details...</p>
    </div>
    <a class="btn btn-primary" th:href="@{/characters}">
        <i class="bi bi-house"></i> <span th:text="#{error.back}">Back to home</span>
    </a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
