<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(#{characters.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="#{characters.heading}">Characters</h1>
        <span class="d-none d-lg-inline-block badge text-bg-secondary fs-6"
              th:text="#{characters.count(${#lists.size(characters)})}">Number of characters: 0</span>
    </div>

    <form class="row g-2 align-items-end mb-4" th:action="@{/characters}" method="get">
        <div class="col-12 col-sm-auto">
            <label for="crewName" class="form-label" th:text="#{characters.filter.crew}">Filter by crew:</label>
            <select id="crewName" name="crewName" class="form-select">
                <option value="" th:text="#{characters.choose.crew}">-- choose a crew --</option>
                <option th:each="crew : ${crews}"
                        th:value="${crew.name}"
                        th:text="${crew.name}"
                        th:selected="${crew.name == selectedCrew}"></option>
            </select>
        </div>
        <div class="col-12 col-sm-auto">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-funnel"></i> <span th:text="#{button.filter}">Filter</span>
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/characters}" th:text="#{button.reset}">Reset</a>
        </div>
    </form>

    <div class="card shadow-sm mb-4" sec:authorize="isAuthenticated()">
        <div class="card-body">
            <h2 class="h5 mb-3" th:text="#{ajaxAdd.heading}">Quick add (no page refresh)</h2>

            <div id="addCharacterAlert" class="alert alert-danger d-none"></div>

            <form id="addCharacterForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" th:text="#{addCharacter.label.name}">Name:</label>
                    <input type="text" class="form-control" data-field="name">
                    <div class="invalid-feedback d-block" data-error-for="name"></div>
                </div>
                <div class="col-md-2">
                    <label class="form-label" th:text="#{addCharacter.label.age}">Age:</label>
                    <input type="number" class="form-control" data-field="age">
                    <div class="invalid-feedback d-block" data-error-for="age"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" th:text="#{addCharacter.label.appearance}">Appearance:</label>
                    <input type="url" class="form-control" placeholder="https://..." data-field="appearance">
                    <div class="invalid-feedback d-block" data-error-for="appearance"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{addCharacter.label.powertype}">Powertype:</label>
                    <select class="form-select" data-field="powertype">
                        <option value="" th:text="#{addCharacter.choose}">-- choose --</option>
                        <option th:each="pt : ${powertypes}" th:value="${pt}" th:text="${pt}"></option>
                    </select>
                    <div class="invalid-feedback d-block" data-error-for="powertype"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{addCharacter.label.power}">Power (DON):</label>
                    <input type="number" step="0.1" class="form-control" data-field="power">
                    <div class="invalid-feedback d-block" data-error-for="power"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{addCharacter.label.crew}">Crew:</label>
                    <select class="form-select" data-field="crewName">
                        <option value="" th:text="#{addCharacter.choose}">-- choose --</option>
                        <option th:each="c : ${crews}" th:value="${c.name}" th:text="${c.name}"></option>
                    </select>
                    <div class="invalid-feedback d-block" data-error-for="crewName"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{ajaxAdd.label.sword}">Sword (optional):</label>
                    <input type="text" class="form-control" data-field="swordName">
                    <div class="invalid-feedback d-block" data-error-for="swordName"></div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-lightning-charge"></i> <span th:text="#{button.add}">Add</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="characterGrid" class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4">
        <div class="col" th:id="${'character-card-' + character.id}" th:each="character : ${characters}">
            <div class="card h-100 shadow-sm"
                 th:classappend="${character.power >= 9.0} ? 'border-warning border-2' : ''">
                <img class="card-img-top character-img" th:src="${character.appearance}"
                     th:alt="${character.name}">
                <div class="card-body">
                    <h5 class="card-title d-flex justify-content-between align-items-center">
    <span>
        <span th:text="${character.name}">Name</span>
        <span class="badge text-bg-warning ms-1"
              th:if="${character instanceof T(be.kdg.programming5.onepiece.business.domain.Swordsman)}">
            <i class="bi bi-shield"></i> Swordsman
        </span>
    </span>
                        <i class="bi bi-star-fill text-warning" th:if="${character.power >= 9.0}"></i>
                    </h5>
                    <p class="card-text">
                        <span sec:authorize="isAuthenticated()"
                              class="badge text-bg-primary" th:text="${character.power} + ' DON'">0 DON</span>
                        <span sec:authorize="isAnonymous()"
                              class="badge text-bg-secondary"
                              th:title="#{characters.power.hiddenHint}"
                              th:text="#{characters.power.hidden}">???</span>
                        <span class="badge text-bg-info" th:text="${character.powertype}">TYPE</span>
                    </p>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary flex-grow-1"
                       th:href="@{/characters/{id}(id=${character.id})}">
                        <i class="bi bi-eye"></i> <span th:text="#{characters.details}">View details</span>
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-danger btn-delete-character"
                            th:if="${#authorization.expression('hasRole(''ADMIN'')') or (character.owner != null and #authentication.name == character.owner.username)}"
                            th:data-character-id="${character.id}"
                            th:title="#{button.delete}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
