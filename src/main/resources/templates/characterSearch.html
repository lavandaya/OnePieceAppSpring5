<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{search.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{search.heading}">Search Characters</h1>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="#{search.byName}">By name</h5>
                    <form th:action="@{/characters/search}" method="get">
                        <div class="mb-3">
                            <input type="text" name="name" class="form-control"
                                   th:placeholder="#{search.byName.placeholder}"
                                   th:value="${searchName}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> <span th:text="#{button.filter}">Filter</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="#{search.byPower}">By minimum power</h5>
                    <form th:action="@{/characters/search}" method="get">
                        <div class="mb-3">
                            <input type="number" name="minPower" class="form-control"
                                   step="0.1" min="0"
                                   th:placeholder="#{search.byPower.placeholder}"
                                   th:value="${searchMinPower}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> <span th:text="#{button.filter}">Filter</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="#{search.byBattles}">By battles fought</h5>
                    <form th:action="@{/characters/search}" method="get">
                        <div class="mb-3">
                            <input type="number" name="minBattles" class="form-control"
                                   min="1"
                                   th:placeholder="#{search.byBattles.placeholder}"
                                   th:value="${searchMinBattles}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> <span th:text="#{button.filter}">Filter</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <section th:if="${results != null}">
        <h2 class="h4 mb-3" th:text="#{search.results(${#lists.size(results)})}">Results</h2>
        <div class="alert alert-info" th:if="${#lists.isEmpty(results)}"
             th:text="#{search.noResults}">No results found.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(results)}">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th th:text="#{characters.table.id}">ID</th>
                    <th th:text="#{characters.table.name}">Name</th>
                    <th th:text="#{characters.table.powertype}">Powertype</th>
                    <th th:text="#{characters.table.power}">Power</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${results}"
                    th:classappend="${c.power >= 9.0} ? 'table-warning' : ''">
                    <td th:text="${c.id}"></td>
                    <td>
                        <a th:href="@{/characters/{id}(id=${c.id})}" th:text="${c.name}">name</a>
                        <span class="badge text-bg-warning ms-1"
                              th:if="${c instanceof T(be.kdg.programming3.onepiece.business.domain.Swordsman)}">
                            <i class="bi bi-shield"></i>
                        </span>
                    </td>
                    <td><span class="badge text-bg-info" th:text="${c.powertype}">TYPE</span></td>
                    <td><span class="badge text-bg-primary" th:text="${c.power} + ' DON'">0</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
